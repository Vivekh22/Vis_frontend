<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VispriscaAds</title>
    <!--
      A baseline Content-Security-Policy meta is included here as defense-in-depth
      BEFORE any JavaScript executes. The authoritative, versioned CSP lives in
      security/ContentSecurityPolicy.ts (applied at runtime). Keeping a minimal
      meta here ensures protection is active even before the app boots.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"
    />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
